name: Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  test:
    name: test
    uses: taihen/.github/.github/workflows/go-ci.yml@v1
    with:
      # Same steps as before the migration: tidy check, build, gofmt, vet and
      # `go test -race -v ./...` (includes catalogue validation), so every
      # boolean stays at its default. The checkout no longer fetches full
      # history — no test step used it; release.yml keeps fetch-depth: 0.
      # Input contract: taihen/.github README; changes/failures: issue there.
      test-args: "-race -v ./..."
