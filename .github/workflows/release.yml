name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch: # TEMPORARY: no-publish proof for the migration PR, reverted next commit

permissions:
  contents: write # Needed to create releases and push tags

jobs:
  release:
    name: Create Release
    # Write-token path: pinned by SHA, never @v1. See taihen/.github README.
    uses: taihen/.github/.github/workflows/go-release-semantic.yml@d208b8abb127c84723d456ae30825fe78088a830 # v1.1.0
    with:
      runs-on: ubuntu-22.04
      binary-name: dns-benchmark
      main-package: ./cmd
      targets: "linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"
      version-source: git-describe
      ldflags: "-s -w"
      tidy-check: true

  homebrew:
    name: Update Homebrew tap
    needs: release
    # Same gate as the old inline step: only after semantic-release published.
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read # The tap push goes to taihen/homebrew-tap with HOMEBREW_TAP.
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Update Homebrew tap
        env:
          TAG_NAME: ${{ needs.release.outputs.new_release_git_tag }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP }}
        run: bash ./scripts/update-homebrew-formula.sh
